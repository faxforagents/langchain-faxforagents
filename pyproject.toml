[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-faxforagents"
version = "0.1.0"
description = "Fax for Agents tools for LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fax for Agents", email = "hello@faxforagents.com"}]
keywords = ["langchain", "langgraph", "fax", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "langchain-core>=1.7.4,<2",
  "faxforagents>=0.2.3,<0.3",
  "pydantic>=2.7.4,<3",
]

[project.urls]
Homepage = "https://faxforagents.com/"
Documentation = "https://faxforagents.com/docs/"
Repository = "https://github.com/faxforagents/langchain-faxforagents"
Changelog = "https://github.com/faxforagents/langchain-faxforagents/blob/main/CHANGELOG.md"

[project.optional-dependencies]
examples = ["langchain>=1.4.8,<2", "langgraph>=1.2.19,<1.3", "langchain-anthropic>=1.7.9,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_faxforagents"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "submissions", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/langchain_faxforagents"]
